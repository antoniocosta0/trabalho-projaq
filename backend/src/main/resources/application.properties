spring.application.name=planos-de-voo

# Banco H2 em ARQUIVO (nao em memoria): o enunciado exige que o estado
# sobreviva a reinicializacao da aplicacao (secao 8.2).
spring.datasource.url=jdbc:h2:file:./data/planosdevoo;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Console do H2 em http://localhost:8080/h2-console
spring.h2.console.enabled=true

# O schema e criado pelos scripts de src/main/resources/db, nao pelo Hibernate.
# Trocar para 'update' durante a prototipagem, mas voltar para 'none' antes da
# entrega: schema gerado automaticamente nao e reproduzivel nem versionavel.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/schema.sql
spring.sql.init.data-locations=classpath:db/data.sql

# Corpo de erro nunca leva stack trace. O spring-boot-devtools, que esta no
# pom, liga isso por padrao - e na apresentacao qualquer campo faltando
# despejaria 40 linhas de Java na resposta.
server.error.include-stacktrace=never

# Swagger UI em http://localhost:8080/swagger-ui.html
springdoc.swagger-ui.path=/swagger-ui.html
