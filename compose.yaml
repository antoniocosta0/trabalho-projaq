name: planos-de-voo

services:
  planos:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: pas/planos-de-voo:${PLANOS_TAG:-p2-etapa0}
    environment:
      APP_RELOGIO_ZONA: ${APP_RELOGIO_ZONA:-America/Sao_Paulo}
      APP_RELOGIO_INSTANTE_FIXO: ${APP_RELOGIO_INSTANTE_FIXO:-}
    volumes:
      - planos-data:/app/data
    ports:
      - "127.0.0.1:${PLANOS_PORT:-8080}:8080"
    networks:
      - planos-net
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    restart: unless-stopped

networks:
  planos-net:
    driver: bridge

volumes:
  planos-data:
