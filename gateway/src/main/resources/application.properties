spring.application.name=gateway
server.port=8080

eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka}

# lista de instâncias curta: um serviço parado vira 503 em poucos segundos
eureka.client.registry-fetch-interval-seconds=5
spring.cloud.loadbalancer.cache.ttl=5s

# sem proxies confiáveis o gateway não envia X-Forwarded-*, e o Swagger perde o prefixo /gestao
spring.cloud.gateway.server.webflux.trusted-proxies=.*

spring.cloud.gateway.server.webflux.routes[0].id=gestao
spring.cloud.gateway.server.webflux.routes[0].uri=lb://planos-de-voo
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/gestao/**
spring.cloud.gateway.server.webflux.routes[0].filters[0]=StripPrefix=1

management.endpoints.web.exposure.include=health
