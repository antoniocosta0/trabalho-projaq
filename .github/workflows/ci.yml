name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [backend, cadastro, registro, gateway, eureka]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Testes
        working-directory: ${{ matrix.app }}
        run: ./mvnw -B clean verify
      - name: Domínio sem dependência de infraestrutura
        if: matrix.app == 'backend' || matrix.app == 'cadastro' || matrix.app == 'registro'
        run: |
          if grep -rn "org.springframework\|jakarta.persistence\|infra\." ${{ matrix.app }}/src/main/java/com/pucrs/*/domain/; then
            exit 1
          fi
